<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>藏文大藏经总目录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tibetan:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--panel:#fffdf8;--ink:#2b2620;--muted:#7a7166;--line:#e4ddd0;--accent:#8a3b12;--accent2:#2f5d62;--chip:#efe8da;--hl:#fff1c2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1916;--panel:#23201c;--ink:#ece6da;--muted:#a59b8c;--line:#3a352e;--accent:#e08a5a;--accent2:#7fb3b8;--chip:#2f2a24;--hl:#4a3f1c}}
:root[data-theme="dark"]{--bg:#1b1916;--panel:#23201c;--ink:#ece6da;--muted:#a59b8c;--line:#3a352e;--accent:#e08a5a;--accent2:#7fb3b8;--chip:#2f2a24;--hl:#4a3f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Serif SC","Songti SC","SimSun",serif}
.bo{font-family:"Noto Serif Tibetan","Microsoft Himalaya","Jomolhari",serif;font-size:1.15em;line-height:1.9}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
h1{margin:0 0 8px;font-size:20px;letter-spacing:.05em}
h1 small{font-size:13px;color:var(--muted);font-weight:normal;margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 320px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
select,button{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0;height:calc(100vh - 110px)}
#list{overflow:auto;border-right:1px solid var(--line)}
#detail{overflow:auto;padding:16px 20px}
.stat{padding:8px 16px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.item{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--chip)}.item.on{background:var(--hl)}
.item .t{font-weight:600}.item .s{color:var(--muted);font-size:13px}
.id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent2);margin-right:6px}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--chip);color:var(--muted);margin:0 4px 2px 0;white-space:nowrap}
.chip.g{background:color-mix(in srgb,var(--accent2) 22%,transparent);color:var(--ink)}
.chip.w{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink)}
.more{display:block;width:calc(100% - 32px);margin:12px 16px}
h2{margin:4px 0 6px;font-size:21px}
table.kv{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.kv th{text-align:left;color:var(--muted);font-weight:normal;width:7.5em;vertical-align:top;padding:4px 8px 4px 0}
table.kv td{padding:4px 0;word-break:break-word}
a{color:var(--accent)}a.x{cursor:pointer;text-decoration:underline}
.sec{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 6px;font-size:15px;color:var(--accent2)}
pre.text{white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:60vh;overflow:auto;margin:6px 0}
.empty{color:var(--muted);padding:40px 20px;text-align:center}
.note{font-size:12px;color:var(--muted)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#list{max-height:55vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>藏文大藏经总目录<small id="sub">加载中…</small></h1>
  <div class="bar">
    <input id="q" type="search" placeholder="书名（汉 / 藏 / 威利 / 梵）、作者、编号（如 D4090、T1558、K-0001）" autocomplete="off">
    <select id="fb"><option value="">全部三部</option><option>甘珠尔</option><option>丹珠尔</option><option>松绷</option></select>
    <select id="fc"><option value="">全部部类</option></select>
    <select id="ft"><option value="">汉译情况：全部</option><option value="ancient">有古代汉译</option><option value="modern">有近现代汉译</option><option value="none">未见汉译</option></select>
    <select id="fr"><option value="">注释关系：全部</option><option value="hasc">有注疏的根本典</option><option value="isc">注疏类（已找到所释）</option></select>
    <button id="theme" title="切换深浅色">◐</button>
  </div>
</header>
<main>
  <section id="list"></section>
  <section id="detail"><div class="empty">在左侧选择一个条目</div></section>
</main>
<script>
const $=s=>document.querySelector(s);
let DATA=[],BYID={},view=[],shown=0;const PAGE=200;
const norm=s=>(s||'').toLowerCase();
function trKind(r){const t=r.tr||'';return t.includes('近现代')&&!t.includes('仅据书名')?'modern':(t.startsWith('有古代')?'ancient':(t==='未见汉译'?'none':'other'))}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){
  try{const r=await fetch('data/catalog.json');DATA=await r.json();}catch(e){$('#sub').textContent='数据加载失败：请用本地服务器打开（见 README）';return}
  DATA.forEach(r=>{BYID[r.id]=r;r._s=norm([r.id,r.zh,r.bo,r.wy,r.sa,r.en,r.au,r.ao,r.d,r.h,r.a,r.rk,r.ts,r.mo,r.dr].join(' '))});
  const n={甘珠尔:0,丹珠尔:0,松绷:0};DATA.forEach(r=>n[r.b]++);
  $('#sub').textContent=`共 ${DATA.length.toLocaleString()} 条 · 甘珠尔 ${n.甘珠尔} · 丹珠尔 ${n.丹珠尔} · 松绷 ${n.松绷}`;
  fillCats();apply();const h=decodeURIComponent(location.hash.slice(1));if(h&&BYID[h])show(h);
}
function fillCats(){const b=$('#fb').value,s=new Map();DATA.forEach(r=>{if(!b||r.b===b)s.set(r.c,(s.get(r.c)||0)+1)});
  $('#fc').innerHTML='<option value="">全部部类</option>'+[...s].map(([c,k])=>`<option value="${esc(c)}">${esc(c)}（${k}）</option>`).join('')}
function apply(){
  const q=norm($('#q').value.trim()),b=$('#fb').value,c=$('#fc').value,t=$('#ft').value,f=$('#fr').value;
  const terms=q.split(/\s+/).filter(Boolean);
  view=DATA.filter(r=>(!b||r.b===b)&&(!c||r.c===c)&&(!t||trKind(r)===t)&&(!f||(f==='hasc'?r.cb:r.cm))&&terms.every(x=>r._s.includes(x)));
  shown=0;$('#list').innerHTML=`<div class="stat">找到 ${view.length.toLocaleString()} 条</div>`;more();
}
function more(){const L=$('#list');L.querySelector('.more')?.remove();
  const frag=document.createDocumentFragment();
  view.slice(shown,shown+PAGE).forEach(r=>{const d=document.createElement('div');d.className='item';d.dataset.id=r.id;
    const k=trKind(r);
    d.innerHTML=`<div class="t"><span class="id">${r.id}</span>${esc(r.zh||'（未译）')}</div>
      <div class="s bo">${esc((r.bo||'').slice(0,80))}</div>
      <div class="s">${r.au?esc(r.au)+' · ':''}${esc(r.c)}${r.d?' · '+r.d:''} ${k==='ancient'?'<span class="chip g">古译</span>':''}${k==='modern'?'<span class="chip g">近现代汉译</span>':''}${r.cb?`<span class="chip w">注疏 ${r.cb.length}</span>`:''}${r.cp?'<span class="chip">版权</span>':''}</div>`;
    d.onclick=()=>show(r.id);frag.appendChild(d)});
  L.appendChild(frag);shown+=PAGE;
  if(shown<view.length){const m=document.createElement('button');m.className='more';m.textContent=`显示更多（还有 ${view.length-shown} 条）`;m.onclick=more;L.appendChild(m)}
}
function link(id){const r=BYID[id];return r?`<a class="x" data-go="${id}">${id} ${esc(r.zh||'')}</a>`:esc(id)}
function taishoLinks(s){return esc(s).replace(/T(\d{1,4}[A-Za-z]?)/g,(m,n)=>`<a href="https://cbetaonline.dila.edu.tw/T${n.padStart(4,'0')}" target="_blank">T${n}</a>`)}
function show(id){const r=BYID[id];if(!r)return;location.hash=encodeURIComponent(id);
  document.querySelectorAll('.item.on').forEach(e=>e.classList.remove('on'));document.querySelector(`.item[data-id="${CSS.escape(id)}"]`)?.classList.add('on');
  const row=(k,v,cls='')=>v?`<tr><th>${k}</th><td class="${cls}">${v}</td></tr>`:'';
  const cm=(r.cm||[]).map(([x,t])=>`<li>${link(x)}　<span class="chip">${esc(t)}</span></li>`).join('');
  const cb=(r.cb||[]).map(([x,t])=>`<li>${link(x)}　<span class="chip">${esc(t)}</span></li>`).join('');
  $('#detail').innerHTML=`<div class="id">${r.id} · ${esc(r.b)} · ${esc(r.c)}${r.sc?' › '+esc(r.sc):''}</div>
  <h2>${esc(r.zh||'（未译）')}</h2><div class="bo">${esc(r.bo||'')}</div>
  <table class="kv">
  ${row('译名来源',esc(r.zt)+(r.dr&&r.dr!==r.zh?`<div class="note">原拟译：${esc(r.dr)}</div>`:''))}
  ${row('汉译情况',esc(r.tr))}${row('大正藏对应',r.ts?taishoLinks(r.ts):'')}${row('近现代汉译',esc(r.mo))}
  ${row('威利转写',esc(r.wy))}${row('梵文书名',esc(r.sa))}${row('英文书名',esc(r.en))}
  ${row('作者',esc(r.au)+(r.ao&&r.ao!==r.au?`<span class="note">（${esc(r.ao)}）</span>`:'')+(r.ad?`<span class="note"> ${esc(r.ad)}</span>`:''))}
  ${row('译者',esc(r.tl))}${row('德格编号',esc(r.d))}${row('拉萨版编号',esc(r.h))}${row('ACIP编号',esc(r.a))}${row('rKTs编号',esc(r.rk))}
  ${row('德格函·叶码',esc(r.dv))}${row('音节数',r.n?Number(r.n).toLocaleString():'')}${row('版权提示',esc(r.cp))}${row('备注',esc(r.nt))}
  </table>
  ${cm?`<div class="sec"><h3>所释典籍</h3><ul>${cm}</ul></div>`:''}
  ${cb?`<div class="sec"><h3>注疏（${r.cb.length}）</h3><ul>${cb}</ul></div>`:''}
  <div class="sec"><h3>藏文原文</h3>
   ${r.f1?`<button data-f="${esc(r.f1)}">${r.b==='松绷'?'阅读文本':'阅读 ACIP 版'}</button> `:''}${r.f2?`<button data-f="${esc(r.f2)}">阅读德格版（Esukhia）</button>`:''}
   ${!r.f1&&!r.f2?'<span class="note">无文本文件</span>':''}
   <div id="txt"></div></div>`;
  $('#detail').scrollTop=0;
  $('#detail').querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>show(a.dataset.go));
  $('#detail').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>readText(b.dataset.f));
}
async function readText(f){const box=$('#txt');box.innerHTML='<div class="note">读取中…</div>';
  try{const r=await fetch('../'+f.split('/').map(encodeURIComponent).join('/'));if(!r.ok)throw new Error(r.status);
    const t=await r.text();let n=40000;
    const render=()=>{box.innerHTML=`<div class="note">${f}　共 ${t.length.toLocaleString()} 字符</div><pre class="text bo">${esc(t.slice(0,n))}</pre>`+(n<t.length?'<button id="tm">继续显示</button>':'');
      $('#tm')&&($('#tm').onclick=()=>{n+=80000;render()})};render();
  }catch(e){box.innerHTML=`<div class="note">读取失败（${e.message}）。在线目录版不含藏文原文；原文需按仓库 README 的说明下载数据后本地查看。</div>`}}
let tm;$('#q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(apply,180)});
$('#fb').onchange=()=>{fillCats();apply()};['#fc','#ft','#fr'].forEach(s=>$(s).onchange=apply);
window.addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(h&&BYID[h])show(h)});
$('#theme').onclick=()=>{const d=document.documentElement;const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('theme',d.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
load();
</script>
</body>
</html>
